<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Friend Computer Eye</title>

  <link rel="stylesheet" href="css/friend-computer.css">

</head>
<script src="js/friend-computer.js" defer></script>
<body>
<audio id="crt-start" src="audio/CRT_Start.mp3"></audio>
<audio id="crt-hum" src="audio/CRT_Hum.mp3" loop></audio>

<div id="crt">
  <div id="frame">
    <div id="sys-label">
      AlphaOS vNULL.222-10v4(6)_FINAL(2) · STATUS: BUFFER OVERFLOW
    </div>
    <div id="threat-indicator">
      <span id="threat-label">THREAT LEVEL: BLUE</span>
    </div>
    <div id="rec-container">
      <div id="rec-light"></div>
      <div id="rec-text">REC</div>
    </div>

    <div id="screen">
      <div id="crt-warmup"></div>
      <div id="crt-shutdown"></div>
      <div id="crt-degauss"></div>

      <div id="scanlines"></div>

      <div id="eye">
        <div id="iris">
          <div id="pupil"></div>
        </div>
        <div id="highlight"></div>
        <div id="lid-top" class="lid"></div>
        <div id="lid-bottom" class="lid"></div>
      </div>

      <div id="error-overlay">
        SYSTEM ERROR – REPORT TO NEAREST TERMINATION BOOTH
      </div>

      <div id="clone-overlay">
        STAND BACK - NEW CLONE DELIVERY INCOMING
      </div>

      <div id="ad-overlay">
        <div id="ad-content">
          <div id="ad-product"></div>
          <img id="ad-image" src="" alt="Alpha Complex Product">
          <div id="ad-text-main"></div>
          <div id="ad-text-sub"></div>
          <div id="ad-text-mini"></div>
        </div>
      </div>

      <div id="status-text"></div>

      <!-- put it HERE -->
      <div id="noise-overlay"></div>
    </div>

  </div>
</div>

<div id="controls">
  <button id="btn-toggle-eye">Hide Eye (H)</button>
  <button id="btn-ad">Show Ad (B)</button>
  <button id="btn-glitch">Glitch (G)</button>
  <button id="btn-destabilize">Destabilize Iris</button>
  <button id="btn-happy-ad">Mandatory Happiness</button>
  <button id="btn-clone">New Clone (C)</button>
  <button id="btn-interrogate">Interrogation (Q)</button>
  <button id="btn-interrogate">Interrogation (Q)</button>
  <button id="btn-drugged">Drugged (L)</button>


  <!-- NEW: Friend Computer speech controls -->
  <div id="speech-controls">
    <textarea
            id="fc-text"
            rows="2"
            placeholder="Type Friend Computer's response here…"
    ></textarea>
    <button id="btn-fc-speak">Speak</button>
  </div>
</div>

<div id="help">
  Mouse: aim · 1–4: players · P: patrol · A: angry · E: ERROR · S: squint · I: double-blink · H: hide eye · B: ad
</div>

<script>

</script>
</body>
</html>
